<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#141f36"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
    <linearGradient id="boxCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="boxGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="boxPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6d28d9"/>
    </linearGradient>
    <linearGradient id="boxRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#b91c1c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1250" fill="url(#bgGrad)" rx="16"/>
  <rect x="2" y="2" width="996" height="1246" fill="none" stroke="#1e293b" stroke-width="2" rx="16"/>

  <!-- Title Badge -->
  <rect x="250" y="25" width="500" height="50" rx="25" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="56" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="1">SUN TRACKING DECISION FLOWCHART</text>

  <!-- Step 1: Timer Trigger -->
  <rect x="350" y="105" width="300" height="48" rx="24" fill="url(#boxBlue)" filter="url(#shadow)"/>
  <text x="500" y="135" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">START: 160ms Tracking Interval</text>

  <line x1="500" y1="153" x2="500" y2="185" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: ADC Read -->
  <rect x="300" y="185" width="400" height="65" rx="10" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="212" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">1. Sample 4x Analog Channels (A0 - A3)</text>
  <text x="500" y="235" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="13">Raw 10-Bit ADC Read: TL, TR, BL, BR [0 .. 1023]</text>

  <line x1="500" y1="250" x2="500" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: EMA Filter -->
  <rect x="280" y="280" width="440" height="70" rx="10" fill="url(#boxCyan)" filter="url(#shadow)"/>
  <text x="500" y="308" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">2. Digital Low-Pass Exponential Moving Average</text>
  <text x="500" y="332" text-anchor="middle" fill="#ecfeff" font-family="Segoe UI, sans-serif" font-size="13">S_t = 0.12 * Raw + 0.88 * S_(t-1)  (Dampens Transient Noise)</text>

  <line x1="500" y1="350" x2="500" y2="380" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Quadrant Sums -->
  <rect x="250" y="380" width="500" height="65" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="405" text-anchor="middle" fill="#22d3ee" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">3. Quadrant Aggregation & Error Calculation</text>
  <text x="500" y="428" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">Top = TL+TR, Bottom = BL+BR | Left = TL+BL, Right = TR+BR</text>

  <line x1="500" y1="445" x2="500" y2="475" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Decision 1: Night Detection -->
  <polygon points="500,475 660,535 500,595 340,535" fill="#1e293b" stroke="#f59e0b" stroke-width="3" filter="url(#shadow)"/>
  <text x="500" y="528" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Avg Lux &lt; 150?</text>
  <text x="500" y="548" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="12">(Nighttime Cutoff)</text>

  <!-- Night Branch -->
  <line x1="660" y1="535" x2="780" y2="535" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="715" y="525" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">YES</text>
  
  <rect x="780" y="505" width="180" height="60" rx="8" fill="url(#boxPurple)" filter="url(#shadow)"/>
  <text x="870" y="530" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">NIGHT STOW POSE</text>
  <text x="870" y="550" text-anchor="middle" fill="#e9d5ff" font-family="Segoe UI, sans-serif" font-size="12">H = 175°, V = 5°</text>

  <!-- Day Branch Down -->
  <line x1="500" y1="595" x2="500" y2="635" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="618" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold">NO (Daylight Active)</text>

  <!-- Dual Axis Splitting Box -->
  <rect x="200" y="635" width="600" height="40" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="660" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Differential Tracking Evaluation: ΔH = Left - Right | ΔV = Top - Bottom</text>

  <!-- Split into H and V branches -->
  <line x1="330" y1="675" x2="330" y2="710" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="670" y1="675" x2="670" y2="710" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- HORIZONTAL COLUMN -->
  <polygon points="330,710 440,755 330,800 220,755" fill="#1e293b" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="330" y="750" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">|ΔH| &gt; 110?</text>
  <text x="330" y="768" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">H_TOLERANCE</text>

  <!-- H YES -->
  <line x1="330" y1="800" x2="330" y2="835" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="345" y="820" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">YES</text>

  <rect x="235" y="835" width="190" height="55" rx="8" fill="url(#boxBlue)" filter="url(#shadow)"/>
  <text x="330" y="857" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Step Azimuth</text>
  <text x="330" y="877" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, sans-serif" font-size="11">CurrentH ± moveSpeed</text>

  <!-- H NO -->
  <line x1="220" y1="755" x2="140" y2="755" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="755" x2="140" y2="920" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="920" x2="330" y2="920" stroke="#64748b" stroke-width="2"/>
  <text x="175" y="745" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">NO (Hold)</text>

  <!-- VERTICAL COLUMN -->
  <polygon points="670,710 780,755 670,800 560,755" fill="#1e293b" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="670" y="750" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">|ΔV| &gt; 70?</text>
  <text x="670" y="768" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">V_TOLERANCE</text>

  <!-- V YES -->
  <line x1="670" y1="800" x2="670" y2="835" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="685" y="820" fill="#10b981" font-family="Segoe UI, sans-serif" font-size="11" font-weight="bold">YES</text>

  <rect x="575" y="835" width="190" height="55" rx="8" fill="url(#boxGreen)" filter="url(#shadow)"/>
  <text x="670" y="857" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold">Step Elevation</text>
  <text x="670" y="877" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="11">CurrentV ± moveSpeed</text>

  <!-- V NO -->
  <line x1="780" y1="755" x2="860" y2="755" stroke="#64748b" stroke-width="2"/>
  <line x1="860" y1="755" x2="860" y2="920" stroke="#64748b" stroke-width="2"/>
  <line x1="860" y1="920" x2="670" y2="920" stroke="#64748b" stroke-width="2"/>
  <text x="795" y="745" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11">NO (Hold)</text>

  <!-- Convergence to Clamp -->
  <line x1="330" y1="890" x2="330" y2="950" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="670" y1="890" x2="670" y2="950" stroke="#10b981" stroke-width="2.5"/>
  <line x1="330" y1="950" x2="500" y2="950" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="670" y1="950" x2="500" y2="950" stroke="#10b981" stroke-width="2.5"/>
  <line x1="500" y1="950" x2="500" y2="975" stroke="#e2e8f0" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 5: Clamp & Apply -->
  <rect x="260" y="975" width="480" height="65" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="500" y="1002" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">4. Boundary Clamp & Actuation Output</text>
  <text x="500" y="1025" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">Constrain [5°, 175°] -&gt; servoH.write(h), servoV.write(v)</text>

  <line x1="500" y1="1040" x2="500" y2="1070" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 6: Telemetry Out -->
  <rect x="250" y="1070" width="500" height="65" rx="10" fill="url(#boxPurple)" filter="url(#shadow)"/>
  <text x="500" y="1097" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">5. Transmit Telemetry to ESP32 Gateway</text>
  <text x="500" y="1120" text-anchor="middle" fill="#f3e8ff" font-family="Segoe UI, sans-serif" font-size="13">Serial Stream: "POS:h,v" and "LDR:tl,tr,bl,br" @ 9600 Baud</text>

  <line x1="500" y1="1135" x2="500" y2="1165" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- End Pill -->
  <rect x="360" y="1165" width="280" height="44" rx="22" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="1192" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Wait 160ms for Next Frame</text>

</svg>
